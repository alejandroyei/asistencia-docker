name: asistencia

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./backend/scripts/seed-pregrados-uniempresarial.sql:/docker-entrypoint-initdb.d/002-seed-pregrados.sql:ro
    restart: unless-stopped
    networks:
      - red-data

  backend:
    image: alejandroyei/node-asistencia:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB} 
    ports:
      - "127.0.0.1:${BACKEND_PUBLISHED_PORT}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - red-app
      - red-data

  frontend:
    image: alejandroyei/angular-asistencia:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PUBLISHED_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app

networks:
  red-app:
    driver: bridge
  red-data:
    driver: bridge
    internal: true

volumes:
  postgres_data:

name: Build and publish asistencia images

on:
  push:
    branches:
      main

jobs:
  build-backend:
    name: Validar applicación
    runs-on: ubuntu-latest
    steps:
      - name: Verificación repositorio
        uses: actions/checkout@v7

      - name: Configuración Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar y compilar backend
        working-directory: backend
        run: npm ci && npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t alejandroyei/node-asistencia:latest .
      
      - name: Publicar imagen en Docker Hub
        run: docker push alejandroyei/node-asistencia:latest

  deploy-backend:
    needs: build-backend
    runs-on: self-hosted
    steps:
      - name: Actualizar contenedor backend
        run: |
          cd C:\asistencia-docker
          docker compose pull backend
          docker compose up -d backend
